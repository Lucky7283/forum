spring.application.name=anime-azerbaycan
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/anime_aze}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
app.jwt.signing-key=${JWT_SIGNING_KEY:a9739161121c0e7d02d8c1b88f9f51c25c5060b0a37a57d76555ef9277b9b76b}
app.jwt.ttl=${JWT_TTL:PT24H}
app.client-origin=${CLIENT_ORIGIN:*}
app.jikan.base-url=${JIKAN_BASE_URL:https://api.jikan.moe/v4}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# none | jikan | anilist | kitsu | json | filling (AniList: at most 100 catalog entries per run)
app.anime-import.provider=${ANIME_IMPORT_PROVIDER:filling}
app.anime-import.start-page=${ANIME_IMPORT_START_PAGE:1}
app.anilist.base-url=${ANILIST_BASE_URL:https://graphql.anilist.co}

# provider=json reads Anime5K from resources (also supports external file paths)
app.anime-import.file=${ANIME_IMPORT_FILE:classpath:anime_aggregated.jsonl}

# Kitsu is selected manually via app.anime-import.provider=kitsu.
app.kitsu.base-url=${KITSU_BASE_URL:https://kitsu.app/api/edge}

# English -> Azerbaijani synopsis translation via LibreTranslate.
# Opt in to one translation batch at startup, after the import runner.
app.anime-translation.enabled=${ANIME_TRANSLATION_ENABLED:true}
app.anime-translation.libretranslate.base-url=${LIBRETRANSLATE_BASE_URL:http://127.0.0.1:5000}
# Optional for a local instance; required when the server requires authentication.
app.anime-translation.libretranslate.api-key=${LIBRETRANSLATE_API_KEY:}
# Maximum anime examined per manual call (already translated records are excluded).
app.anime-translation.max-items=${ANIME_TRANSLATION_MAX_ITEMS:10}
# Maximum Unicode code points per request; longer descriptions are split.
app.anime-translation.max-chars-per-request=${ANIME_TRANSLATION_MAX_CHARS_PER_REQUEST:2000}
app.anime-translation.request-interval-ms=${ANIME_TRANSLATION_REQUEST_INTERVAL_MS:1000}

# Regenerate OpenAPI so the genre dropdown reflects the current genre table.
springdoc.cache.disabled=true
